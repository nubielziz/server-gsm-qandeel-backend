# Local infrastructure for the GSM backend: Postgres, the two Redis roles, S3-compatible storage, Prometheus and a mail catcher.
# Start with `docker compose up -d`; host ports can be overridden through the GSM_*_PORT variables.
# Decision records: docs/decisions/004-local-s3-minio.md (MinIO image), 006-redis-topology.md (two Redis roles),
# 015-observability.md (Prometheus).
name: gsm-backend

services:
  postgres:
    image: postgres:18.6-trixie
    # Several feature worktrees run their test suites at the same time, each against its own database on this server: the
    # default of 100 connections runs out, so the local server allows 300.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: gsm
      POSTGRES_PASSWORD: gsm
      POSTGRES_DB: gsm
    ports:
      - "${GSM_PG_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker, so the volume mounts the parent.
      - pgdata:/var/lib/postgresql
      # Creates the gsm_test database used by integration and scenario tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsm -d gsm"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Queue Redis: BullMQ is only correct when nothing is evicted, so noeviction + AOF (fsync every second).
  redis-queue:
    image: redis:8.10.3-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "${GSM_REDIS_QUEUE_PORT:-6379}:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Cache Redis: LRU eviction is wanted here, persistence is not (the cache is rebuilt from Postgres).
  redis-cache:
    image: redis:8.10.3-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${GSM_REDIS_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO built from source by Chainguard (MinIO no longer publishes community images). Pinned by digest.
  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    command: ["server", "/data", "--console-address", ":9001"]
    # The image runs as uid 65532; a fresh named volume is root-owned, so local dev runs it as root.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: gsm-minio
      MINIO_ROOT_PASSWORD: gsm-minio-secret
    ports:
      - "${GSM_S3_PORT:-9000}:9000"
      - "${GSM_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # One-shot: creates the buckets the app expects (idempotent; new buckets are private).
  # The image has no shell, so the alias comes from MC_HOST_local and Docker retries until MinIO answers.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:5b759d9e248ad9f1ab8455f8168b86a47acb1e08207d38603b504bdc5a555d7a
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://gsm-minio:gsm-minio-secret@minio:9000
    command: ["mb", "--ignore-existing", "local/gsm-files", "local/gsm-files-test"]
    restart: on-failure

  # Prometheus scrapes the API (:3000) and the worker (:9464) that run on the host; the System health pages query it
  # (PROMETHEUS_URL=http://localhost:9090). Targets, and how production scrapes with the METRICS_TOKEN, are in
  # docker/prometheus/prometheus.yml. Pinned by tag and digest; the image runs as `nobody` and owns /prometheus.
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    # Lets the container reach the API and the worker running on the host (Linux Docker does not define the name itself).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GSM_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Local mail catcher (decision 033): the API and the worker send through SMTP on 1025 (MAIL_SMTP_URL in development), and the
  # web UI on 8025 shows every message. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_MAX_MESSAGES: 5000
    ports:
      - "${GSM_MAIL_SMTP_PORT:-1025}:1025"
      - "${GSM_MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redis-queue-data:
  minio-data:
  prometheus-data:
