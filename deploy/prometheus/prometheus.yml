# Prometheus of the production stack (feature 24D, decision 036): scrapes the API (:3000) and the worker (:9464) over the compose
# network with the METRICS_TOKEN, which production requires. The token is mounted as the compose secret `metrics_token`.
# Check changes with:
#   docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: gsm-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:3000"]

  - job_name: gsm-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["worker:9464"]
