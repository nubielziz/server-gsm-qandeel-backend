# Prometheus for the GSM backend (decision 015): scrapes /metrics of the API and of the worker. The System health pages
# (metrics, errors, queue trend) query it through PROMETHEUS_URL; started by `docker compose up -d` (service `prometheus`).
#
# Local development: the API and the worker run on the host, so the container reaches them through host.docker.internal
# (compose.yaml maps it to the host gateway). The API answers /metrics without a token to private addresses, which the
# Docker bridge is, so nothing else is needed. Start the API with HOST=0.0.0.0 (the default) so the bridge can reach it,
# and change the worker target below if you changed WORKER_METRICS_PORT (prometheus.yml cannot read environment variables).
#
# Production: METRICS_TOKEN is required, so Prometheus must send it as "Authorization: Bearer <token>". Keep the token out of
# this file: write it to a file that only Prometheus can read (no trailing newline), mount it into the container, and
# add this block to BOTH jobs below, with the real targets (and `scheme: https` if they use TLS):
#
#     authorization:
#       type: Bearer
#       credentials_file: /etc/prometheus/secrets/metrics-token
#
# Check changes with:
#   docker run --rm --entrypoint promtool -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
#     prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  # API process: http_request_duration_seconds, api_errors_total, cache_*, redis_memory_*, bullmq_queue_*, ...
  - job_name: gsm-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]

  # Worker process: queue_jobs_processed_total, queue_job_duration_seconds, outbox_*, bullmq_queue_*, ...
  # (the queue gauges are in both processes: read them with max by (queue, state)).
  - job_name: gsm-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
